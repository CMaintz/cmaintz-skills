# Runs the same `mise run gate` the loop runs locally, so CI and the agent agree on green.
name: gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Pin mise itself, not just the action: unpinned, it resolves "latest", which can
      # name a release whose assets are not published yet.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5
        with:
          version: "2026.9.18"
      - run: mise run gate
