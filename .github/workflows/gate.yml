# Runs the same `mise run gate` the loop runs locally, so CI and the agent agree on green.
name: gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # Pin mise itself, not just the action: unpinned, it resolves "latest", which can
      # name a release whose assets are not published yet.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5
        with:
          version: "2026.9.18"
      - run: mise run gate
