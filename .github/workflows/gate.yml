# Runs the same `mise run gate` the loop runs locally, so CI and the agent agree on green.
name: gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Pin mise itself, not just the action: unpinned, it resolves "latest", which can
      # name a release whose assets are not published yet.
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5
        with:
          version: "2026.9.18"
      - run: mise run gate
