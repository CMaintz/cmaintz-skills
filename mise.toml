# The six Foundry contract verbs (see CONTRACT.md), so `feature` and `ship` can work
# this repo's tickets. The same `gate` runs locally and in CI (.github/workflows/gate.yml).

[tools]
node = "22.23.4"
# Same version the old checksum-pinned shellcheck workflow installed.
shellcheck = "0.11.0"
gitleaks = "8.30.1"
# foundry-loop-report is Python; pinned so its smell-trend test and the MCP server tests that
# run it use the same interpreter here and in CI.
python = "3.12.15"

[tasks.fix]
description = "Mechanical fixes. None yet"
# No formatter is configured for this repo's shell or JS, so there is nothing to apply.
run = "true"

[tasks.lint]
description = "shellcheck every shell file the plugin ships or tests with"
# Every file in the plugin's hooks/, including the extensionless git hook (pre-push). hooks.json is
# the plugin's hook manifest, not a script. foundry-loop-report is Python, so it is left out.
run = [
    "find plugins/foundry/hooks -type f ! -name '*.json' -print0 | xargs -0 shellcheck",
    "shellcheck plugins/foundry/scripts/foundry-pr-report plugins/foundry/scripts/foundry-pr-watch plugins/foundry/scripts/foundry-ship-pr",
    "find plugins/foundry/scripts -name '*.sh' ! -path '*/vendor/*' -print0 | xargs -0 shellcheck",
    "find tests -type f -name '*.sh' -print0 | xargs -0 shellcheck",
]

[tasks.typecheck]
description = "Type checking. None yet"
# The JS is plain .mjs with no tsconfig or JSDoc types to check, so there is no checker to run.
run = "true"

# The MCP server's SDK is an npm dependency of the plugin (plugins/foundry/package.json);
# its tests import it, so install the locked tree first. No-op once it is installed.
[tasks."setup:mcp-deps"]
description = "Install the plugin's locked npm dependencies (the MCP SDK) for the tests"
run = "test -d plugins/foundry/node_modules/@modelcontextprotocol/sdk || npm ci --prefix plugins/foundry --no-audit --no-fund"

[tasks.test]
description = "Node unit tests, the MCP server tests and the shell tests for hooks and scripts"
depends = ["setup:mcp-deps"]
# Quoted so node expands the glob, not the shell (bash has no ** without globstar).
run = [
    "node --test \"plugins/foundry/scripts/**/*.test.mjs\"",
    "bash tests/pre-commit.test.sh",
    "bash tests/auto-format.test.sh",
    "bash tests/habit-hooks-guard.test.sh",
    "bash tests/foundry-ship-pr.test.sh",
    "bash tests/mcp-deps.test.sh",
    "bash tests/foundry-loop-report.test.sh",
    "bash tests/guard-governance-labels.test.sh",
    "bash tests/foundry-pr-watch.test.sh",
]

[tasks.audit]
description = "Secret scan of the working tree"
# `dir` rather than `git`: CI checks out shallow, so a history scan would see one commit
# there and the whole history locally. The working tree is the same in both.
run = "gitleaks dir --no-banner --redact ."

[tasks.gate]
description = "The authoritative composite - the oracle. Nothing merges without this green."
# A sequential array, not `depends`: mise runs dependencies in parallel with no ordering,
# which interleaves output and hides which check failed first.
run = [
    "mise run lint",
    "mise run typecheck",
    "mise run test",
    "mise run audit",
]
